# À coller dans Container Manager → Projet → Créer (voir docs/MISE-EN-LIGNE.md).
# Au démarrage : clone ou met à jour le dépôt GitHub, installe et lance le serveur.
# Pour déployer une nouvelle version : pousser sur GitHub, puis redémarrer le projet.
# Si la nouvelle version échoue aux tests (npm test), l'ancienne est remise et démarre à sa place.
services:
  gestion-repas:
    image: node:20-alpine
    container_name: gestion-repas
    restart: unless-stopped
    ports:
      - "3011:3011"
    environment:
      - PORT=3011
      - TZ=Europe/Paris
      # Jeton de l'intégration Notion (vide = mode démo, données dans le conteneur)
      - NOTION_TOKEN=
      # Identifiant de la page Notion commune à Repax, Agendix et Argenx (même valeur dans les trois)
      - NOTION_PAGE_ID=
      # Mot de passe demandé une fois sur chaque téléphone (fortement conseillé : l'appli est sur Internet)
      - APP_PASSWORD=
      # Jeton du widget iPhone (32 caractères au moins, aléatoire ; vide = widget désactivé). Voir README, « Widget iPhone »
      - WIDGET_TOKEN=
    volumes:
      - ./app:/app
    working_dir: /app
    command: >
      sh -c "apk add --no-cache git &&
             git config --global --add safe.directory /app &&
             if [ -d /app/.git ]; then
               AVANT=$$(git rev-parse HEAD);
               git fetch --depth 1 origin main && git reset --hard FETCH_HEAD;
               if ! (npm ci --omit=dev && NOTION_TOKEN= npm test); then
                 echo 'Nouvelle version en echec aux tests : retour a la precedente';
                 git reset --hard $$AVANT && npm ci --omit=dev;
               fi;
             else
               git clone --depth 1 https://github.com/Kaloomc/Repax.git /app && npm ci --omit=dev;
             fi &&
             npm start"
